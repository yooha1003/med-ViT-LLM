# MRI Diagnosis Pipeline Configuration

# Segmentation Model Configuration
segmentation:
  model_type: "unet3d"  # Options: unet3d, nnunet, monai
  num_classes: 2  # Background + target structure
  checkpoint_path: null  # Path to pretrained weights
  base_features: 32
  dropout: 0.1

# Feature Extraction Configuration
feature_extraction:
  use_radiomics: true
  radiomics_params:
    binWidth: 25
    resampledPixelSpacing: null
    interpolator: "sitkBSpline"
    verbose: false

  # Feature categories to extract
  extract_volumetric: true
  extract_morphological: true
  extract_intensity: true
  extract_texture: true

# LLM Interpretation Configuration
interpretation:
  use_llm: true

  # Model Selection - Compatible with ANY HuggingFace model
  # General-purpose LLMs:
  #   - "microsoft/phi-2" (2.7B, good for CPU)
  #   - "microsoft/Phi-3-mini-4k-instruct" (3.8B)
  #   - "meta-llama/Llama-2-7b-chat-hf" (7B, requires auth)
  #   - "meta-llama/Meta-Llama-3-8B-Instruct" (8B, requires auth)
  #   - "mistralai/Mistral-7B-Instruct-v0.2" (7B)
  #   - "mistralai/Mixtral-8x7B-Instruct-v0.1" (47B)
  #   - "HuggingFaceH4/zephyr-7b-beta" (7B)
  #   - "google/gemma-2b-it" (2B)
  #   - "google/gemma-7b-it" (7B)
  #   - "01-ai/Yi-6B-Chat" (6B)
  #   - "Qwen/Qwen2-7B-Instruct" (7B)
  #
  # Medical-specific LLMs:
  #   - "epfl-llm/meditron-7b" (7B, medical knowledge)
  #   - "BioMistral/BioMistral-7B" (7B, biomedical)
  #   - "johnsnowlabs/JSL-MedLlama-3-8B-v2.0" (8B, clinical)
  #   - "aaditya/Llama3-OpenBioLLM-8B" (8B, biomedical)
  #
  model_name: "microsoft/phi-2"

  # Generation Parameters
  max_new_tokens: 512  # Maximum tokens to generate
  temperature: 0.7  # 0.0 = deterministic, 1.0+ = creative
  top_p: 0.95  # Nucleus sampling
  top_k: 50  # Top-k sampling
  repetition_penalty: 1.15  # Prevent repetition

  # Model Loading Options
  torch_dtype: "auto"  # Options: auto, float16, bfloat16, float32
  load_in_8bit: false  # Enable 8-bit quantization (saves memory)
  load_in_4bit: false  # Enable 4-bit quantization (saves more memory)
  trust_remote_code: true  # Required for some models
  use_chat_template: true  # Use model's built-in chat template if available

  # Advanced Options
  custom_prompt_template: null  # Override automatic template detection
  generation_config: null  # Custom generation config (overrides above)

# Device Configuration
device:
  use_gpu: true
  device_id: 0  # GPU device ID (if multiple GPUs available)
  mixed_precision: true

# Data Configuration
data:
  input_format: "nifti"  # Options: nifti, dicom
  expected_spacing: [1.0, 1.0, 1.0]  # mm

  # Preprocessing
  normalize: true
  clip_intensity: false
  clip_range: [0, 100]  # percentiles

# Output Configuration
output:
  save_segmentation: true
  save_features: true
  save_report: true
  save_visualization: true
  output_format: "nifti"  # For segmentation masks

# Clinical Settings
clinical:
  default_structures:
    - name: "Hippocampus"
      description: "Hippocampal volume and morphology analysis"
      normal_volume_range: [2.5, 4.5]  # cm³

    - name: "Pituitary Gland"
      description: "Pituitary volume and intensity analysis"
      normal_volume_range: [0.4, 0.8]  # cm³

    - name: "Brain Tumor"
      description: "Tumor volume and characteristics"
      normal_volume_range: null

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_logs: true
  log_file: "pipeline.log"

# Performance
performance:
  batch_size: 1
  num_workers: 4
  cache_size: 1000  # MB
